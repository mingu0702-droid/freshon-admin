<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Freshon 관리자</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <div>
      <h1>Freshon 고정배차 관리자</h1>
      <p class="version-note">엑셀 업로드, 저장자료 조회, 구글시트 동기화를 관리합니다.</p>
      <nav class="page-nav" aria-label="페이지 이동">
        <a href="/daily-routes.html">일일동선</a>
        <a href="/daily-routes.html?tab=wms">WMS</a>
        <a href="/operations-data.html">운영데이터</a>
        <a href="/admin.html">관리자</a>
      </nav>
    </div>
    <div id="status">상태 확인 중</div>
  </header>

  <main>
    <section class="toolbar">
      <div>
        <label for="adminToken">관리자 토큰</label>
        <input id="adminToken" type="password" placeholder="Render ADMIN_TOKEN">
      </div>
      <button id="saveTokenButton" class="secondary" type="button">토큰 저장</button>
      <button id="reloadButton" type="button">저장자료 조회</button>
      <button id="sheetSyncButton" type="button">구글시트 동기화</button>
      <button id="csvButton" type="button">CSV 다운로드</button>
    </section>

    <section class="toolbar upload-toolbar">
      <div class="wide">
        <label for="fixedDispatchFiles">고정배차 엑셀 업로드</label>
        <input id="fixedDispatchFiles" type="file" multiple accept=".xlsx,.xls,.csv">
        <p class="help-text">여러 엑셀 파일을 선택해도 하나로 합쳐 저장합니다. 중복 데이터는 서버에서 병합합니다.</p>
      </div>
      <button id="uploadButton" type="button">엑셀 저장</button>
    </section>

    <section class="toolbar search-toolbar">
      <div class="wide">
        <label for="adminSearchInput">매장/코드/주소 검색</label>
        <input id="adminSearchInput" type="search" placeholder="예: 할맥, S10922, 강남구, 101호">
        <p class="help-text">고객코드, 매장명, 주소, 호차로 저장자료를 바로 찾습니다.</p>
      </div>
      <button id="clearSearchButton" class="secondary" type="button">검색 초기화</button>
    </section>

    <section class="route-status">
      <b>저장 상태</b>
      <span id="uploadStatus">-</span>
    </section>

    <section id="adminSearchCards" class="admin-search-cards" aria-live="polite"></section>

    <section class="summary">
      <div><span>기준 기간</span><b id="rangeText">-</b></div>
      <div><span>갱신 시각</span><b id="generatedAt">-</b></div>
      <div><span>행 수</span><b id="rowCount">0</b></div>
    </section>

    <section class="table-wrap">
      <table id="dataTable"></table>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
