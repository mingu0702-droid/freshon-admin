<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Freshon 운영데이터</title>
  <style>
    :root { --blue:#2563eb; --line:#cfdced; --soft:#eef4fb; --text:#071831; --muted:#56667a; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,"Noto Sans KR",sans-serif; color:var(--text); background:#eaf1f8; }
    header { display:flex; justify-content:space-between; gap:16px; align-items:center; padding:18px 24px; background:#fff; border-bottom:1px solid var(--line); }
    h1 { margin:0; font-size:28px; } p { margin:6px 0 0; color:var(--muted); }
    nav { display:flex; gap:8px; flex-wrap:wrap; }
    nav a, button { border:1px solid #b9c9de; background:#fff; border-radius:7px; padding:10px 16px; font-weight:700; color:#071831; text-decoration:none; cursor:pointer; }
    nav a.active, button.primary, .tab.active { background:var(--blue); color:#fff; border-color:var(--blue); }
    .bar { display:grid; grid-template-columns:150px 150px 1fr 170px 120px; gap:10px; padding:14px 18px; background:#fff; border-bottom:1px solid var(--line); }
    label { display:block; font-size:12px; font-weight:700; margin-bottom:5px; }
    input, select { width:100%; height:40px; border:1px solid #c9d6e6; border-radius:7px; padding:0 12px; font-size:14px; background:#fff; }
    .source { padding:10px 18px; background:#f8fbff; border-bottom:1px solid var(--line); color:#39516f; font-size:14px; }
    .tabs { display:flex; gap:8px; padding:16px 18px 10px; }
    .grid { display:grid; grid-template-columns:repeat(6,1fr); gap:12px; padding:12px 18px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px; box-shadow:0 10px 22px rgba(21,43,70,.04); }
    .kpi span { display:block; color:var(--muted); font-size:13px; margin-bottom:7px; }
    .kpi strong { font-size:24px; }
    .main { display:grid; grid-template-columns:1.35fr 1fr; gap:14px; padding:0 18px 18px; }
    .panel { background:#fff; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
    .panel-head { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--line); }
    .list { max-height:430px; overflow:auto; padding:10px 14px; }
    .row { border:1px solid #d6e2f0; border-radius:8px; padding:12px; margin-bottom:10px; cursor:pointer; background:#fff; }
    .row.active { border-color:var(--blue); background:#eef5ff; }
    .row b { display:block; margin-bottom:5px; } .row small { color:var(--muted); }
    .detail { padding:16px; min-height:260px; }
    .detail-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
    .stat { border:1px solid #d5e1ef; border-radius:8px; padding:12px; }
    .stat span { color:var(--muted); font-size:13px; display:block; } .stat strong { font-size:22px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { border-bottom:1px solid #dbe5f1; padding:9px 8px; text-align:left; }
    th { background:#f5f8fc; width:120px; } .empty { padding:22px; color:var(--muted); }
    @media (max-width:1100px) { .bar,.grid,.main { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <div><h1>운영데이터</h1><p>관리자 월 캐시와 운영지도 기준 데이터를 한 화면에서 봅니다.</p></div>
    <nav>
      <a href="/daily-routes.html">일일동선</a><a href="/daily-routes.html?tab=wms">WMS</a><a class="active" href="/operations-data.html">운영데이터</a><a href="/admin.html">관리자</a>
    </nav>
  </header>
  <section class="bar">
    <div><label>분석 월</label><select id="month"><option value="">전체 캐시</option></select></div>
    <div><label>센터</label><select id="center"><option>오산센터</option></select></div>
    <div><label>고객/주소/호차 검색</label><input id="q" placeholder="101호차, S10922, 할맥, 은평구"></div>
    <div><label>보기 기준</label><select id="sort"><option value="vehicle">호차순</option><option value="amount">매출 높은 순</option><option value="stops">착지 많은 순</option><option value="coords">좌표 필요 순</option></select></div>
    <div><label>&nbsp;</label><button class="primary" id="refresh">데이터 갱신</button></div>
  </section>
  <div class="source" id="source">데이터를 불러오는 중입니다.</div>
  <section class="tabs">
    <button class="tab active" data-tab="vehicle">호차 분석</button>
    <button class="tab" data-tab="store">매장 분석</button>
    <button class="tab" data-tab="coord">좌표 관리</button>
    <button class="tab" data-tab="adjust">조정 후보</button>
  </section>
  <section class="grid" id="kpis"></section>
  <section class="main">
    <div class="panel">
      <div class="panel-head"><div><b id="listTitle">호차별 월 데이터</b><p id="listSub">매출, 착지수, 착지당 금액 기준입니다.</p></div><span id="listCount"></span></div>
      <div class="list" id="list"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><div><b id="detailTitle">상세</b><p>항목을 선택해주세요.</p></div><span id="detailBadge">대기</span></div>
      <div class="detail" id="detail">항목을 선택해주세요.</div>
    </div>
  </section>
  <section class="panel" style="margin:0 18px 18px;">
    <div class="panel-head"><div><b>원본 미리보기</b><p>월 캐시에서 최근 순서대로 일부만 표시합니다.</p></div></div>
    <div class="list" id="preview"></div>
  </section>
  <script>
    const nf = new Intl.NumberFormat("ko-KR");
    const state = { summary:null, tab:"vehicle", selected:null, computed:null };
    const $ = (id) => document.getElementById(id);
    const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (m) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
    const num = (v) => Number(String(v ?? "").replace(/[^\d.-]/g, "")) || 0;
    const money = (n) => `${nf.format(Math.round(Number(n) || 0))}원`;
    const vehicleNo = (v) => String(v ?? "").replace(/\D/g, "");
    const amountOf = (r) => num(r.amount ?? r.dailyAmount ?? r.monthlyAmount ?? r.salesAmount ?? r.totalAmount ?? r["매출금액"] ?? r["금액"]);

    function computeSummary() {
      const rows = Array.isArray(state.summary?.rows) ? state.summary.rows : [];
      const vehicles = new Map();
      const stores = new Map();
      const coords = [];
      let totalAmount = 0;
      rows.forEach((r, index) => {
        const vehicle = vehicleNo(r.vehicle) || String(r.vehicle ?? "").trim() || "-";
        const code = String(r.customerCode ?? r.code ?? "").trim();
        const name = String(r.customerName ?? r.name ?? "").trim();
        const address = String(r.address ?? "").trim();
        const amount = amountOf(r);
        const date = String(r.deliveryDate ?? r.date ?? "").trim();
        totalAmount += amount;
        if (!vehicles.has(vehicle)) vehicles.set(vehicle, { vehicle, stops:0, amount:0, stores:new Set(), lastDate:"", rows:[] });
        const v = vehicles.get(vehicle);
        v.stops += 1; v.amount += amount; v.lastDate = date || v.lastDate; v.rows.push(r); if (code || name) v.stores.add(code || `${name}|${address}`);
        const key = code || `${name}|${address}`;
        if (key && !stores.has(key)) stores.set(key, { code, name, address, vehicle, amount:0, stops:0, lastDate:"", rows:[] });
        if (key) { const s = stores.get(key); s.amount += amount; s.stops += 1; s.lastDate = date || s.lastDate; s.rows.push(r); }
        if (!num(r.lat) || !num(r.lng)) coords.push({ ...r, _index:index });
      });
      state.computed = {
        rows,
        rowCount: rows.length,
        totalAmount,
        vehicleCount: vehicles.size,
        storeCount: stores.size,
        coordinateMissingCount: coords.length,
        vehicles: [...vehicles.values()].map(v => ({ ...v, storeCount:v.stores.size, avg:v.stops ? v.amount / v.stops : 0 })),
        stores: [...stores.values()].map(s => ({ ...s, avg:s.stops ? s.amount / s.stops : 0 })),
        coords
      };
    }

    function filtered(items) {
      const q = $("q").value.trim().toLowerCase();
      if (!q) return items;
      return items.filter((item) => JSON.stringify(item).toLowerCase().includes(q));
    }

    function sorted(items) {
      const mode = $("sort").value;
      return [...items].sort((a,b) => {
        if (mode === "amount") return (b.amount || 0) - (a.amount || 0);
        if (mode === "stops") return (b.stops || 0) - (a.stops || 0);
        if (mode === "coords") return (b._index || 0) - (a._index || 0);
        return String(a.vehicle || a.code || a.name || "").localeCompare(String(b.vehicle || b.code || b.name || ""), "ko", { numeric:true });
      });
    }

    function currentItems() {
      const c = state.computed || {};
      if (state.tab === "store") return sorted(filtered(c.stores || []));
      if (state.tab === "coord") return sorted(filtered(c.coords || []));
      if (state.tab === "adjust") return sorted(filtered((c.vehicles || []).filter(v => v.avg > 450000 || v.stops >= 35)));
      return sorted(filtered(c.vehicles || []));
    }

    function renderKpis() {
      const c = state.computed || {};
      const avg = c.rowCount ? c.totalAmount / c.rowCount : 0;
      const items = [
        ["총 착지수", `${nf.format(c.rowCount || 0)}건`, "시트 행 기준"],
        ["총 매출", money(c.totalAmount || 0), "amount/dailyAmount 기준"],
        ["착지당 금액", money(avg), "매출/착지 기준"],
        ["운행 호차", `${nf.format(c.vehicleCount || 0)}대`, "월 캐시 기준"],
        ["좌표 보정 필요", `${nf.format(c.coordinateMissingCount || 0)}곳`, "lat/lng 누락"],
        ["매장 수", `${nf.format(c.storeCount || 0)}곳`, "고객코드 합산"]
      ];
      $("kpis").innerHTML = items.map(([a,b,c]) => `<div class="card kpi"><span>${a}</span><strong>${b}</strong><p>${c}</p></div>`).join("");
    }

    function renderList() {
      const items = currentItems();
      $("listCount").textContent = `${nf.format(items.length)}건`;
      $("list").innerHTML = items.length ? items.slice(0,500).map((item, i) => {
        const title = state.tab === "store" ? `${item.code || "-"} · ${item.name || "-"}` : state.tab === "coord" ? `${item.customerCode || "-"} · ${item.customerName || "-"}` : `${item.vehicle}호`;
        const meta = state.tab === "coord" ? item.address : `${nf.format(item.stops || 0)}착지 · ${money(item.amount || 0)} · 착지당 ${money(item.avg || 0)}`;
        return `<div class="row${i===0 ? " active" : ""}" data-i="${i}"><b>${esc(title)}</b><small>${esc(meta)}</small></div>`;
      }).join("") : `<div class="empty">결과가 없습니다. 검색 조건을 바꿔주세요.</div>`;
      $("list").querySelectorAll(".row").forEach((el) => el.addEventListener("click", () => {
        $("list").querySelectorAll(".row").forEach(x => x.classList.remove("active"));
        el.classList.add("active");
        renderDetail(items[Number(el.dataset.i)]);
      }));
      renderDetail(items[0]);
    }

    function renderDetail(item) {
      if (!item) { $("detailTitle").textContent = "상세"; $("detail").textContent = "항목을 선택해주세요."; return; }
      const title = item.vehicle ? `${item.vehicle}호 상세` : `${item.customerCode || item.code || "-"} 상세`;
      $("detailTitle").textContent = title;
      $("detailBadge").textContent = "상세";
      const rows = item.rows || [item];
      $("detail").innerHTML = `
        <div class="detail-grid">
          <div class="stat"><span>매출</span><strong>${money(item.amount || amountOf(item))}</strong></div>
          <div class="stat"><span>착지/주문</span><strong>${nf.format(item.stops || rows.length || 0)}건</strong></div>
          <div class="stat"><span>착지당 금액</span><strong>${money(item.avg || 0)}</strong></div>
        </div>
        <table>
          <tr><th>호차</th><td>${esc(item.vehicle || rows[0]?.vehicle || "-")}</td></tr>
          <tr><th>주소</th><td>${esc(item.address || rows[0]?.address || "-")}</td></tr>
          <tr><th>최종일</th><td>${esc(item.lastDate || rows[0]?.deliveryDate || "-")}</td></tr>
        </table>`;
    }

    function renderPreview() {
      const rows = (state.computed?.rows || []).slice(-20).reverse();
      $("preview").innerHTML = rows.map(r => `<div class="row"><b>${esc(r.deliveryDate || "-")} · ${esc(r.vehicle || "-")}호 · ${esc(r.customerName || "-")}</b><small>${esc(r.address || "")} · ${money(amountOf(r))}</small></div>`).join("") || `<div class="empty">원본 데이터가 없습니다.</div>`;
    }

    function render() {
      const c = state.computed || {};
      $("source").innerHTML = `데이터 출처 <b>${esc(state.summary?.source || "-")}</b> · 행 ${nf.format(c.rowCount || 0)}건 · 매출 ${money(c.totalAmount || 0)} · 갱신 ${esc(state.summary?.updatedAt || "-")}`;
      renderKpis(); renderList(); renderPreview();
    }

    async function loadSummary() {
      $("source").textContent = "데이터를 불러오는 중입니다.";
      const res = await fetch("/api/monthly-dispatch-summary", { cache:"no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      state.summary = await res.json();
      computeSummary();
      render();
    }

    document.querySelectorAll(".tab").forEach(btn => btn.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
      btn.classList.add("active");
      state.tab = btn.dataset.tab;
      renderList();
    }));
    ["q","sort"].forEach(id => $(id).addEventListener("input", renderList));
    $("refresh").addEventListener("click", () => loadSummary().catch(err => { $("source").textContent = `데이터 조회 실패: ${err.message}`; }));
    loadSummary().catch(err => { $("source").textContent = `데이터 조회 실패: ${err.message}`; });
  </script>
</body>
</html>
