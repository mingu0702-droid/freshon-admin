<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>데일리 상차 리포트</title>
  <link rel="manifest" href="./mobile-report-manifest.json">
  <meta name="theme-color" content="#0d3b66">
  <style>
    :root {
      color-scheme: light;
      --bg: #eef3f7;
      --surface: #ffffff;
      --line: #d8e1e8;
      --text: #102033;
      --muted: #647487;
      --blue: #0d3b66;
      --blue-pressed: #092b4a;
      --green: #139b5f;
      --green-soft: #e9f8f0;
      --orange: #e57a21;
      --orange-soft: #fff3e7;
      --shadow: 0 10px 28px rgba(16, 32, 51, 0.10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 2;
      background: rgba(248, 250, 252, 0.96);
      border-bottom: 1px solid var(--line);
      padding: 14px 18px 12px;
      backdrop-filter: blur(12px);
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .date {
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
    }

    main {
      padding: 14px 14px 96px;
      display: grid;
      gap: 12px;
    }

    .page[hidden] {
      display: none;
    }

    section {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 13px 14px 8px;
    }

    h2 {
      margin: 0;
      font-size: 15px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .status {
      color: var(--green);
      background: var(--green-soft);
      border: 1px solid #b9e8cf;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
      white-space: nowrap;
    }

    .body {
      padding: 10px 14px 14px;
      display: grid;
      gap: 10px;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 5px;
    }

    input[type="text"], textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 16px;
      padding: 11px 12px;
      outline: none;
    }

    textarea {
      min-height: 104px;
      resize: vertical;
      line-height: 1.45;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: #81acd2;
      box-shadow: 0 0 0 3px rgba(13, 59, 102, 0.10);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn {
      border: 0;
      border-radius: 8px;
      min-height: 46px;
      padding: 0 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .btn.primary {
      color: #fff;
      background: var(--blue);
    }

    .btn.primary:active { background: var(--blue-pressed); }

    .btn.secondary {
      color: var(--blue);
      background: #e8f0f8;
      border: 1px solid #c9d9e8;
    }

    .btn.warning {
      color: #7a3a00;
      background: var(--orange-soft);
      border: 1px solid #ffd1a8;
    }

    .chips {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .chip {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 8px 11px;
      white-space: nowrap;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
    }

    .chip.active {
      border-color: #f2ae6e;
      background: var(--orange-soft);
      color: #8a4308;
      font-weight: 700;
    }

    .matches {
      display: grid;
      gap: 8px;
    }

    .set-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfdff;
      padding: 10px;
      display: grid;
      gap: 12px;
    }

    .step-title {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--text);
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .step-badge {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: var(--blue);
      color: #fff;
      font-size: 12px;
      flex: 0 0 auto;
    }

    .match {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 10px;
      display: grid;
      gap: 4px;
      text-align: left;
      cursor: pointer;
    }

    .match.selected {
      border-color: #7fc39e;
      background: var(--green-soft);
    }

    .match strong {
      font-size: 14px;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .photo {
      position: relative;
      aspect-ratio: 1;
      border: 1px dashed #aab8c5;
      border-radius: 8px;
      background: #f4f7fa;
      overflow: hidden;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      padding: 6px;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo.add-photo {
      border-style: solid;
      background: #fff;
      color: var(--blue);
      font-size: 26px;
      font-weight: 700;
      cursor: pointer;
    }

    .photo.add-photo input { display: none; }

    .photo-count {
      color: var(--muted);
      font-size: 12px;
    }

    .file-btn {
      display: grid;
      place-items: center;
      border: 1px dashed #9eb0c0;
      background: #f4f7fa;
      border-radius: 8px;
      min-height: 44px;
      color: var(--blue);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .file-btn.camera {
      min-height: 54px;
      border-style: solid;
      border-color: #9cc4e5;
      background: #e8f0f8;
      color: var(--blue);
      font-size: 15px;
    }

    .file-btn.subtle {
      min-height: 40px;
      background: #fff;
      color: var(--muted);
      font-weight: 600;
      font-size: 13px;
    }

    .file-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
    }

    .file-btn input { display: none; }

    .output {
      background: #071f36;
      color: #fff;
      border-radius: 8px;
      padding: 12px;
      font-size: 16px;
      white-space: pre-wrap;
      line-height: 1.45;
    }

    .sticky-actions {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(430px, 100vw);
      background: rgba(248, 250, 252, 0.96);
      border-top: 1px solid var(--line);
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      backdrop-filter: blur(12px);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 84px;
      transform: translateX(-50%);
      background: rgba(16, 32, 51, 0.92);
      color: #fff;
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .toast.show { opacity: 1; }

    .paste-zone {
      border: 1px dashed #9eb0c0;
      border-radius: 8px;
      background: #f4f7fa;
      min-height: 92px;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 12px;
    }

    .paste-zone:focus {
      outline: none;
      border-color: #81acd2;
      box-shadow: 0 0 0 3px rgba(13, 59, 102, 0.10);
    }

    .home-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .home-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      min-height: 104px;
      padding: 12px;
      display: grid;
      align-content: space-between;
      gap: 10px;
      text-align: left;
      color: var(--text);
      cursor: pointer;
    }

    .home-card strong {
      font-size: 15px;
      line-height: 1.3;
    }

    .home-card span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .camera-page {
      min-height: calc(100vh - 84px);
      padding: 0;
      background: #07111d;
      color: #fff;
    }

    .camera-frame {
      min-height: calc(100vh - 84px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      background:
        linear-gradient(rgba(7, 17, 29, 0.20), rgba(7, 17, 29, 0.55)),
        linear-gradient(135deg, #7a8591, #d9dee3 45%, #8b6b51 46%, #c19a73);
    }

    .camera-top {
      padding: 16px 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .camera-pill {
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.26);
      padding: 7px 11px;
      font-size: 13px;
      font-weight: 700;
      backdrop-filter: blur(10px);
    }

    .camera-guide {
      align-self: end;
      margin: 0 16px 12px;
      border-radius: 8px;
      background: rgba(7, 17, 29, 0.78);
      padding: 12px;
      font-size: 14px;
      line-height: 1.45;
      text-align: center;
    }

    .camera-actions {
      padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: 1fr 76px 1fr;
      align-items: center;
      gap: 12px;
      background: rgba(7, 17, 29, 0.88);
    }

    .camera-actions .btn {
      min-height: 44px;
    }

    .shutter {
      width: 72px;
      height: 72px;
      border-radius: 999px;
      border: 5px solid rgba(255, 255, 255, 0.84);
      background: #fff;
      cursor: pointer;
      justify-self: center;
    }

    .camera-actions input { display: none; }

    .camera-thumbs {
      grid-column: 1 / -1;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      min-height: 54px;
    }

    .camera-thumb {
      width: 50px;
      height: 50px;
      border-radius: 8px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.24);
      display: grid;
      place-items: center;
      color: rgba(255, 255, 255, 0.72);
      font-size: 11px;
      flex: 0 0 auto;
    }

    .camera-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="topline">
        <div>
          <h1>데일리 상차 리포트</h1>
          <div class="date" id="todayText"></div>
        </div>
        <span class="status">초안</span>
      </div>
    </header>

    <main class="page" id="homePage">
      <section>
        <div class="section-head">
          <h2>홈</h2>
          <span class="status">고객 데이터 2026.06.04</span>
        </div>
        <div class="body">
          <button class="home-card" id="startReportButton" type="button">
            <strong>오늘 상차 리포트 시작</strong>
            <span>호차 입력부터 전표/미상차 세트 촬영까지 진행</span>
          </button>
          <div class="home-grid">
            <button class="home-card" id="homeFullHistoryButton" type="button">
              <strong>전체 기록 검색</strong>
              <span>호차, 매장, 고객코드로 검색</span>
            </button>
            <button class="home-card" type="button">
              <strong>고객/매장 추가</strong>
              <span>검색 안 되는 신규 지점 임시 저장</span>
            </button>
          </div>
        </div>
      </section>
    </main>

    <main class="page" id="reportPage" hidden>
      <section>
        <div class="section-head">
          <h2>1. 호차 입력</h2>
          <span class="photo-count">먼저 선택</span>
        </div>
        <div class="body">
          <div class="row">
            <div>
              <label for="routeInput">호차</label>
              <input id="routeInput" type="text" value="157호">
            </div>
            <div>
              <label for="stopInput">착순</label>
              <input id="stopInput" type="text" value="1착">
            </div>
          </div>
        </div>
      </section>

      <section>
        <div class="section-head">
          <h2>2. 적재함 사진</h2>
          <span class="photo-count" id="totalPhotoCount">0장</span>
        </div>
        <div class="body">
          <label>호차당 1장</label>
          <div class="file-actions">
            <label class="file-btn camera">
              적재함 촬영
              <input id="loadedCameraInput" type="file" accept="image/*" capture="environment">
            </label>
          </div>
          <div class="photo-grid" id="loadedPreview">
            <label class="photo add-photo" aria-label="적재함 앨범 선택">
              +
              <input id="loadedInput" type="file" accept="image/*">
            </label>
          </div>
        </div>
      </section>

      <section>
        <div class="section-head">
          <h2>3. 전표 / 미상차 세트</h2>
          <span class="photo-count">한 매장씩</span>
        </div>
        <div class="body">
          <div class="set-card">
            <button class="btn primary" id="startSetCameraButton" type="button">세트 촬영 시작</button>
            <div>
              <label for="storeInput">촬영 후 확인할 매장명</label>
              <input id="storeInput" type="text" value="준코" placeholder="예: 준코, 할맥, 치킨플러스">
            </div>
            <button class="btn secondary" id="searchButton">고객 마스터에서 검색</button>
            <div class="matches" id="matches"></div>
            <div class="matches" id="setSummaryList"></div>
          </div>
        </div>
      </section>

      <section>
        <div class="section-head">
          <h2>4. 전송 준비</h2>
          <span class="status">복사용</span>
        </div>
        <div class="body">
          <div>
            <label>사유</label>
            <div class="chips" id="reasonChips">
              <button class="chip" data-reason="">없음</button>
              <button class="chip active" data-reason="CAPA부족">CAPA부족</button>
              <button class="chip" data-reason="미상차">미상차</button>
              <button class="chip" data-reason="현장잔류">현장잔류</button>
              <button class="chip" data-reason="입고불가">입고불가</button>
            </div>
          </div>
          <div>
            <label>전송 방식</label>
            <div class="chips" id="transportChips">
              <button class="chip active" data-transport="용차">용차</button>
              <button class="chip" data-transport="퀵">퀵</button>
            </div>
          </div>
          <div>
            <label>복사할 문구</label>
            <div class="output" id="messageOutput"></div>
          </div>
          <button class="btn warning" id="saveDraftButton">기록 저장</button>
        </div>
      </section>

      <section>
        <div class="section-head">
          <h2>5. 이 호차 과거 기록</h2>
          <span class="status" id="recordCount">0건</span>
        </div>
        <div class="body">
          <div class="matches" id="historyList"></div>
          <button class="btn secondary" id="openFullHistoryButton">전체 기록 검색</button>
        </div>
      </section>
    </main>

    <main class="page camera-page" id="cameraPage" hidden>
      <div class="camera-frame">
        <div class="camera-top">
          <button class="btn secondary" id="closeCameraButton" type="button">닫기</button>
          <span class="camera-pill" id="cameraSetLabel">세트 1</span>
          <span class="camera-pill" id="cameraStepLabel">1/2 전표 촬영</span>
        </div>
        <div class="camera-guide" id="cameraGuide">전표가 화면 안에 들어오게 촬영</div>
        <div class="camera-actions">
          <label class="btn secondary">
            앨범
            <input id="cameraAlbumInput" type="file" accept="image/*" multiple>
          </label>
          <label class="shutter" aria-label="촬영">
            <input id="cameraCaptureInput" type="file" accept="image/*" capture="environment">
          </label>
          <button class="btn primary" id="cameraDoneButton" type="button" hidden>세트 완료</button>
          <button class="btn secondary" id="cameraRetakeButton" type="button">다시촬영</button>
          <div class="camera-thumbs" id="cameraThumbs"></div>
        </div>
      </div>
    </main>

    <main class="page" id="fullHistoryPage" hidden>
      <section>
        <div class="section-head">
          <h2>전체 기록 검색</h2>
          <span class="status" id="fullRecordCount">0건</span>
        </div>
        <div class="body">
          <button class="btn secondary" id="backToReportButton">작업 화면으로 돌아가기</button>
          <div class="row">
            <div>
              <label for="fullRouteInput">호차</label>
              <input id="fullRouteInput" type="text" placeholder="예: 157호">
            </div>
            <div>
              <label for="fullSearchInput">매장/코드</label>
              <input id="fullSearchInput" type="text" placeholder="예: 준코">
            </div>
          </div>
          <div>
            <label>이미지 붙여넣기</label>
            <div class="paste-zone" id="pasteZone" tabindex="0">여기를 누르고 이미지를 붙여넣기</div>
            <div class="photo-grid" id="pastePreview"></div>
          </div>
          <div class="matches" id="fullHistoryList"></div>
          <button class="btn secondary" id="exportCsvButton">전체 기록 CSV 내보내기</button>
        </div>
      </section>
    </main>

    <div class="sticky-actions" id="stickyActions" hidden>
      <button class="btn secondary" id="shareButton">사진 공유</button>
      <button class="btn primary" id="copyButton">문구 복사</button>
    </div>
  </div>
  <div class="toast" id="toast">복사 완료</div>

  <script>
    const sampleMatches = [
      { customerCode: "S90569", storeName: "S-준코 오산점", route: "157호", stopOrder: "1착", address: "경기 오산시 오산동" },
      { customerCode: "S93753", storeName: "S-준코뮤직타운 강릉점", route: "231호", stopOrder: "3착", address: "강원 강릉시" },
      { customerCode: "S99913", storeName: "S-준코뮤직타운 동해천곡점", route: "232호", stopOrder: "2착", address: "강원 동해시" }
    ];
    let customerMasterPromise = null;

    const state = {
      selected: null,
      reason: "CAPA부족",
      transport: "용차",
      loadedPhotos: [],
      unloadedPhotos: [],
      slipPhotos: [],
      sets: [],
      cameraStep: "slip",
      activeSetNo: 1
    };

    const today = new Date();
    const todayLabel = `${today.getMonth() + 1}/${today.getDate()}`;
    document.getElementById("todayText").textContent = `${todayLabel} 현장 보고`;

    const els = {
      storeInput: document.getElementById("storeInput"),
      matches: document.getElementById("matches"),
      routeInput: document.getElementById("routeInput"),
      stopInput: document.getElementById("stopInput"),
      messageOutput: document.getElementById("messageOutput"),
      totalPhotoCount: document.getElementById("totalPhotoCount"),
      historyList: document.getElementById("historyList"),
      recordCount: document.getElementById("recordCount"),
      fullRecordCount: document.getElementById("fullRecordCount"),
      fullHistoryList: document.getElementById("fullHistoryList"),
      fullRouteInput: document.getElementById("fullRouteInput"),
      fullSearchInput: document.getElementById("fullSearchInput"),
      pastePreview: document.getElementById("pastePreview"),
      setSummaryList: document.getElementById("setSummaryList"),
      reportPage: document.getElementById("reportPage"),
      homePage: document.getElementById("homePage"),
      cameraPage: document.getElementById("cameraPage"),
      fullHistoryPage: document.getElementById("fullHistoryPage"),
      stickyActions: document.getElementById("stickyActions"),
      cameraSetLabel: document.getElementById("cameraSetLabel"),
      cameraStepLabel: document.getElementById("cameraStepLabel"),
      cameraGuide: document.getElementById("cameraGuide"),
      cameraDoneButton: document.getElementById("cameraDoneButton"),
      cameraThumbs: document.getElementById("cameraThumbs"),
      toast: document.getElementById("toast")
    };

    function showPage(pageName) {
      els.homePage.hidden = pageName !== "home";
      els.reportPage.hidden = pageName !== "report";
      els.cameraPage.hidden = pageName !== "camera";
      els.fullHistoryPage.hidden = pageName !== "history";
      els.stickyActions.hidden = pageName !== "report";
      scrollTo({ top: 0, behavior: "smooth" });
    }

    function normalizeText(value) {
      return String(value || "").toLowerCase().replace(/\s+/g, "");
    }

    function mapCustomerMasterRow(row) {
      return {
        customerCode: row.customerCode || row.code || "",
        storeName: row.customerName || row.storeName || row.name || "",
        route: row.route || row.vehicle || row.vehicleNo || "",
        stopOrder: row.stopOrder || row.sequence || "",
        address: row.address || "",
        logisticsCenter: row.logisticsCenter || "",
        headquartersCode: row.headquartersCode || ""
      };
    }

    async function loadCustomerMaster() {
      if (!customerMasterPromise) {
        customerMasterPromise = fetch("./customer-master-20260604.json", { cache: "no-store" })
          .then(async (res) => {
            if (!res.ok) throw new Error(`customer master HTTP ${res.status}`);
            const text = await res.text();
            const payload = JSON.parse(text.replace(/^\uFEFF/, ""));
            const rows = payload.customers || payload.rows || [];
            return rows.map(mapCustomerMasterRow);
          })
          .catch(async () => {
            try {
              const res = await fetch(`/api/mobile/customer-search?q=${encodeURIComponent(els.storeInput.value.trim())}`);
              if (!res.ok) throw new Error(`mobile search HTTP ${res.status}`);
              const payload = await res.json();
              return (payload.results || []).map((item) => ({
                customerCode: item.customerCode || "",
                storeName: item.customerName || "",
                route: item.vehicle ? `${item.vehicle}호` : item.route || "",
                stopOrder: item.sequence ? `${item.sequence}착` : "",
                address: item.address || "",
                logisticsCenter: "",
                headquartersCode: ""
              }));
            } catch {
              return sampleMatches;
            }
          });
      }
      return customerMasterPromise;
    }

    async function searchCustomerMaster(query) {
      const normalized = normalizeText(query);
      if (!normalized) return [];
      const customers = await loadCustomerMaster();
      return customers
        .filter((item) => normalizeText([
          item.customerCode,
          item.storeName,
          item.address,
          item.logisticsCenter,
          item.headquartersCode
        ].join(" ")).includes(normalized))
        .slice(0, 30);
    }

    function renderMatches(matches) {
      els.matches.innerHTML = "";
      if (!matches.length) {
        const empty = document.createElement("div");
        empty.className = "meta";
        empty.textContent = "검색 결과가 없습니다. 매장명을 조금 짧게 입력해보세요.";
        els.matches.appendChild(empty);
        return;
      }
      state.selected = matches[0];
      if (!els.routeInput.value.trim()) els.routeInput.value = matches[0].route || "";
      if (!els.stopInput.value.trim()) els.stopInput.value = matches[0].stopOrder || "";
      matches.forEach((item, index) => {
        const button = document.createElement("button");
        button.className = `match ${index === 0 ? "selected" : ""}`;
        button.type = "button";
        button.innerHTML = `
          <strong>${item.storeName}</strong>
          <span class="meta">${item.customerCode} · ${item.route || ""} · ${item.stopOrder || ""} · ${item.logisticsCenter || ""}</span>
          <span class="meta">${item.address || ""}</span>
        `;
        button.addEventListener("click", () => {
          state.selected = item;
          if (!els.routeInput.value.trim()) els.routeInput.value = item.route || "";
          if (!els.stopInput.value.trim()) els.stopInput.value = item.stopOrder || "";
          [...els.matches.querySelectorAll(".match")].forEach((node) => node.classList.remove("selected"));
          button.classList.add("selected");
          updateMessage();
        });
        els.matches.appendChild(button);
      });
      state.selected = matches[0];
      if (!els.routeInput.value.trim()) els.routeInput.value = matches[0].route || "";
      if (!els.stopInput.value.trim()) els.stopInput.value = matches[0].stopOrder || "";
      updateMessage();
    }

    function updateMessage() {
      const route = els.routeInput.value.trim();
      const stop = els.stopInput.value.trim();
      const storeName = state.selected?.storeName || els.storeInput.value.trim();
      const transportLabel = state.transport === "퀵" ? "추가퀵건" : "추가용차건";
      const reasonLine = state.reason ? `● ${todayLabel} ${state.reason} ${transportLabel}\n\n` : "";
      els.messageOutput.textContent = `${reasonLine}${route} ${storeName} ${stop}`.trim();
    }

    const albumInputs = {
      slipPreview: { id: "slipInput", label: "전표 앨범 선택", multiple: false },
      loadedPreview: { id: "loadedInput", label: "적재함 앨범 선택", multiple: false },
      unloadedPreview: { id: "unloadedInput", label: "미상차 앨범 선택", multiple: true }
    };

    function appendAlbumButton(target, targetId) {
      const config = albumInputs[targetId];
      if (!config) return;
      const label = document.createElement("label");
      label.className = "photo add-photo";
      label.setAttribute("aria-label", config.label);
      label.textContent = "+";
      const input = document.createElement("input");
      input.id = config.id;
      input.type = "file";
      input.accept = "image/*";
      if (config.multiple) input.multiple = true;
      label.appendChild(input);
      target.appendChild(label);
    }

    function renderPhotoPreview(targetId, files, emptyText) {
      const target = document.getElementById(targetId);
      if (!target) return;
      target.innerHTML = "";
      if (!files.length) {
        const empty = document.createElement("div");
        empty.className = "photo";
        empty.innerHTML = emptyText;
        target.appendChild(empty);
      }
      files.forEach((file) => {
        const wrapper = document.createElement("div");
        wrapper.className = "photo";
        const img = document.createElement("img");
        img.alt = file.name;
        img.src = URL.createObjectURL(file);
        wrapper.appendChild(img);
        target.appendChild(wrapper);
      });
      appendAlbumButton(target, targetId);
      const total = state.loadedPhotos.length + state.unloadedPhotos.length + state.slipPhotos.length;
      els.totalPhotoCount.textContent = `${total}장`;
    }

    function renderCamera() {
      els.cameraSetLabel.textContent = `세트 ${state.activeSetNo}`;
      const isSlip = state.cameraStep === "slip";
      els.cameraStepLabel.textContent = isSlip ? "1/2 전표 촬영" : "2/2 미상차 촬영";
      els.cameraGuide.textContent = isSlip ? "전표가 화면 안에 들어오게 촬영" : "미상차 잔여 물품을 촬영";
      els.cameraDoneButton.hidden = isSlip || !state.unloadedPhotos.length;
      els.cameraThumbs.innerHTML = "";
      const thumbs = [
        ...state.slipPhotos.map((file) => ({ file, label: "전표" })),
        ...state.unloadedPhotos.map((file, index) => ({ file, label: `미상차 ${index + 1}` }))
      ];
      if (!thumbs.length) {
        const empty = document.createElement("div");
        empty.className = "camera-thumb";
        empty.textContent = "대기";
        els.cameraThumbs.appendChild(empty);
        return;
      }
      thumbs.forEach(({ file, label }) => {
        const thumb = document.createElement("div");
        thumb.className = "camera-thumb";
        const img = document.createElement("img");
        img.alt = label;
        img.src = URL.createObjectURL(file);
        thumb.appendChild(img);
        els.cameraThumbs.appendChild(thumb);
      });
    }

    function renderSetSummary() {
      els.setSummaryList.innerHTML = "";
      if (!state.sets.length) {
        const empty = document.createElement("div");
        empty.className = "meta";
        empty.textContent = "아직 완료된 세트가 없습니다.";
        els.setSummaryList.appendChild(empty);
        return;
      }
      state.sets.forEach((set) => {
        const card = document.createElement("div");
        card.className = "match";
        card.innerHTML = `
          <strong>세트 ${set.setNo}</strong>
          <span class="meta">전표 ${set.slipCount}장 · 미상차 ${set.unloadedCount}장</span>
          <span class="meta">${set.storeName || "매장 확인 대기"} · ${set.customerCode || ""}</span>
        `;
        els.setSummaryList.appendChild(card);
      });
    }

    function showToast(text) {
      els.toast.textContent = text;
      els.toast.classList.add("show");
      setTimeout(() => els.toast.classList.remove("show"), 1500);
    }

    async function runCustomerSearch() {
      const query = els.storeInput.value.trim();
      if (!query) {
        renderMatches([]);
        return;
      }
      els.matches.innerHTML = `<div class="meta">고객 마스터 검색 중...</div>`;
      const matches = await searchCustomerMaster(query);
      renderMatches(matches);
      updateMessage();
    }

    document.getElementById("searchButton").addEventListener("click", runCustomerSearch);
    els.storeInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") runCustomerSearch();
    });

    document.getElementById("startReportButton").addEventListener("click", () => {
      showPage("report");
      renderHistory();
      renderSetSummary();
    });

    document.getElementById("homeFullHistoryButton").addEventListener("click", () => {
      showPage("history");
      renderFullHistory();
    });

    document.getElementById("startSetCameraButton").addEventListener("click", () => {
      state.slipPhotos = [];
      state.unloadedPhotos = [];
      state.cameraStep = "slip";
      state.activeSetNo = state.sets.length + 1;
      renderCamera();
      showPage("camera");
    });

    document.getElementById("closeCameraButton").addEventListener("click", () => {
      showPage("report");
      renderPhotoPreview("slipPreview", state.slipPhotos, "전표<br>미리보기");
      renderPhotoPreview("unloadedPreview", state.unloadedPhotos, "안 실림");
    });

    function acceptCameraFiles(files) {
      if (!files.length) return;
      if (state.cameraStep === "slip") {
        state.slipPhotos = files.slice(0, 1);
        state.cameraStep = "unloaded";
      } else {
        state.unloadedPhotos = mergePhotoFiles(state.unloadedPhotos, files);
      }
      renderCamera();
    }

    document.getElementById("cameraCaptureInput").addEventListener("change", (event) => {
      acceptCameraFiles([...event.target.files]);
      resetFileInput(event);
    });

    document.getElementById("cameraAlbumInput").addEventListener("change", (event) => {
      acceptCameraFiles([...event.target.files]);
      resetFileInput(event);
    });

    document.getElementById("cameraRetakeButton").addEventListener("click", () => {
      if (state.cameraStep === "slip") {
        state.slipPhotos = [];
      } else {
        state.unloadedPhotos = [];
      }
      renderCamera();
    });

    document.getElementById("cameraDoneButton").addEventListener("click", () => {
      const set = {
        setNo: state.sets.length + 1,
        customerCode: state.selected?.customerCode || "",
        storeName: state.selected?.storeName || els.storeInput.value.trim(),
        slipCount: state.slipPhotos.length,
        unloadedCount: state.unloadedPhotos.length
      };
      state.sets.push(set);
      renderSetSummary();
      renderPhotoPreview("slipPreview", state.slipPhotos, "전표<br>미리보기");
      renderPhotoPreview("unloadedPreview", state.unloadedPhotos, "안 실림");
      showPage("report");
      showToast(`세트 ${set.setNo} 완료`);
    });

    function mergePhotoFiles(existing, incoming) {
      const seen = new Set(existing.map((file) => `${file.name}:${file.size}:${file.lastModified}`));
      const next = [...existing];
      incoming.forEach((file) => {
        const key = `${file.name}:${file.size}:${file.lastModified}`;
        if (!seen.has(key)) {
          seen.add(key);
          next.push(file);
        }
      });
      return next;
    }

    function resetFileInput(event) {
      event.target.value = "";
    }

    function handleSlipInput(event) {
      handleSlipFiles(event);
      resetFileInput(event);
    }

    function handleLoadedInput(event) {
      state.loadedPhotos = [...event.target.files].slice(0, 1);
      renderPhotoPreview("loadedPreview", state.loadedPhotos, "적재함");
      resetFileInput(event);
    }

    function handleUnloadedInput(event) {
      state.unloadedPhotos = mergePhotoFiles(state.unloadedPhotos, [...event.target.files]);
      renderPhotoPreview("unloadedPreview", state.unloadedPhotos, "안 실림");
      resetFileInput(event);
    }

    function handleSlipFiles(event) {
      state.slipPhotos = [...event.target.files].slice(0, 1);
      renderPhotoPreview("slipPreview", state.slipPhotos, "전표<br>미리보기");
    }

    function handleLoadedFiles(event) {
      state.loadedPhotos = [...event.target.files];
      renderPhotoPreview("loadedPreview", state.loadedPhotos, "적재함");
    }

    function handleUnloadedFiles(event) {
      state.unloadedPhotos = [...event.target.files];
      renderPhotoPreview("unloadedPreview", state.unloadedPhotos, "안 실림");
    }

    document.getElementById("loadedCameraInput").addEventListener("change", handleLoadedInput);

    document.addEventListener("change", (event) => {
      if (event.target.id === "slipInput") handleSlipInput(event);
      if (event.target.id === "loadedInput") handleLoadedInput(event);
      if (event.target.id === "unloadedInput") handleUnloadedInput(event);
    });

    document.getElementById("reasonChips").addEventListener("click", (event) => {
      const chip = event.target.closest(".chip");
      if (!chip) return;
      state.reason = chip.dataset.reason;
      [...document.querySelectorAll("#reasonChips .chip")].forEach((node) => node.classList.remove("active"));
      chip.classList.add("active");
      updateMessage();
    });

    document.getElementById("transportChips").addEventListener("click", (event) => {
      const chip = event.target.closest(".chip");
      if (!chip) return;
      state.transport = chip.dataset.transport;
      [...document.querySelectorAll("#transportChips .chip")].forEach((node) => node.classList.remove("active"));
      chip.classList.add("active");
      updateMessage();
    });

    function readHistory() {
      try {
        return JSON.parse(localStorage.getItem("daily-report-history") || "[]");
      } catch {
        return [];
      }
    }

    function writeHistory(records) {
      localStorage.setItem("daily-report-history", JSON.stringify(records));
    }

    function renderHistory() {
      const route = normalizeText(els.routeInput.value.trim());
      const records = readHistory().filter((record) => !route || normalizeText(record.route) === route);
      els.recordCount.textContent = `${records.length}건`;
      els.historyList.innerHTML = "";
      if (!records.length) {
        const empty = document.createElement("div");
        empty.className = "meta";
        empty.textContent = "이 호차에 저장된 기록이 없습니다.";
        els.historyList.appendChild(empty);
        return;
      }
      records.slice(0, 5).forEach((record) => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "match";
        item.innerHTML = `
          <strong>${record.storeName || "매장 미확인"}</strong>
          <span class="meta">${record.date} · ${record.transport} · ${record.reason || "사유 없음"}</span>
          <span class="meta">${record.customerCode || ""} · 사진 ${record.photoCount}장</span>
        `;
        item.addEventListener("click", () => showToast("상세 화면은 앱 버전에서 연결"));
        els.historyList.appendChild(item);
      });
    }

    function renderFullHistory() {
      const route = normalizeText(els.fullRouteInput.value.trim());
      const query = normalizeText(els.fullSearchInput.value.trim());
      const records = readHistory().filter((record) => {
        const routeMatch = !route || normalizeText(record.route).includes(route);
        const text = normalizeText(`${record.storeName} ${record.customerCode} ${record.message}`);
        const queryMatch = !query || text.includes(query);
        return routeMatch && queryMatch;
      });
      els.fullRecordCount.textContent = `${records.length}건`;
      els.fullHistoryList.innerHTML = "";
      if (!records.length) {
        const empty = document.createElement("div");
        empty.className = "meta";
        empty.textContent = "검색 결과가 없습니다.";
        els.fullHistoryList.appendChild(empty);
        return;
      }
      records.forEach((record) => {
        const item = document.createElement("div");
        item.className = "match";
        item.innerHTML = `
          <strong>${record.storeName || "매장 미확인"}</strong>
          <span class="meta">${record.date} · ${record.route || ""} · ${record.stopOrder || ""} · ${record.transport}</span>
          <span class="meta">${record.customerCode || ""} · 사진 ${record.photoCount}장</span>
          <button class="btn secondary" type="button" data-copy-message="${record.id}">문구 복사</button>
          <button class="btn warning" type="button" data-copy-images="${record.id}">이미지 복사</button>
        `;
        els.fullHistoryList.appendChild(item);
      });
    }

    function buildCurrentRecord() {
      return {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        savedAt: new Date().toISOString(),
        date: todayLabel,
        customerCode: state.selected?.customerCode || "",
        storeName: state.selected?.storeName || els.storeInput.value.trim(),
        route: els.routeInput.value.trim(),
        stopOrder: els.stopInput.value.trim(),
        reason: state.reason,
        transport: state.transport,
        message: els.messageOutput.textContent,
        photoCount: state.loadedPhotos.length + state.unloadedPhotos.length + state.slipPhotos.length
      };
    }

    function escapeCsv(value) {
      return `"${String(value || "").replaceAll('"', '""')}"`;
    }

    document.getElementById("openFullHistoryButton").addEventListener("click", () => {
      els.fullRouteInput.value = els.routeInput.value.trim();
      showPage("history");
      renderFullHistory();
    });

    document.getElementById("backToReportButton").addEventListener("click", () => {
      showPage("report");
      renderHistory();
    });

    [els.fullRouteInput, els.fullSearchInput].forEach((input) => input.addEventListener("input", renderFullHistory));

    els.fullHistoryList.addEventListener("click", async (event) => {
      const messageButton = event.target.closest("[data-copy-message]");
      const imageButton = event.target.closest("[data-copy-images]");
      if (messageButton) {
        const record = readHistory().find((item) => item.id === messageButton.dataset.copyMessage);
        if (record) {
          await navigator.clipboard.writeText(record.message);
          showToast("문구 복사 완료");
        }
      }
      if (imageButton) {
        showToast("앱 버전에서는 저장된 사진을 바로 복사합니다");
      }
    });

    document.getElementById("pasteZone").addEventListener("paste", (event) => {
      const imageItems = [...event.clipboardData.items].filter((item) => item.type.startsWith("image/"));
      imageItems.forEach((item) => {
        const file = item.getAsFile();
        if (!file) return;
        const wrapper = document.createElement("div");
        wrapper.className = "photo";
        const img = document.createElement("img");
        img.alt = "붙여넣은 이미지";
        img.src = URL.createObjectURL(file);
        wrapper.appendChild(img);
        els.pastePreview.appendChild(wrapper);
      });
      if (imageItems.length) showToast("이미지 붙여넣기 완료");
    });

    document.getElementById("exportCsvButton").addEventListener("click", () => {
      const records = readHistory();
      const header = ["savedAt", "date", "customerCode", "storeName", "route", "stopOrder", "reason", "transport", "photoCount", "message"];
      const rows = [header.join(","), ...records.map((record) => header.map((key) => escapeCsv(record[key])).join(","))];
      const blob = new Blob([`\uFEFF${rows.join("\n")}`], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `daily-report-${new Date().toISOString().slice(0, 10)}.csv`;
      link.click();
      URL.revokeObjectURL(url);
    });

    [els.routeInput, els.stopInput, els.storeInput].forEach((input) => input.addEventListener("input", () => {
      updateMessage();
      renderHistory();
    }));

    document.getElementById("copyButton").addEventListener("click", async () => {
      await navigator.clipboard.writeText(els.messageOutput.textContent);
      showToast("문구 복사 완료");
    });

    document.getElementById("shareButton").addEventListener("click", async () => {
      const files = [...state.loadedPhotos, ...state.unloadedPhotos, ...state.slipPhotos];
      if (navigator.canShare && navigator.canShare({ files })) {
        await navigator.share({ files, title: "데일리 상차 리포트" });
        return;
      }
      showToast("이 브라우저는 사진 공유를 지원하지 않습니다");
    });

    document.getElementById("saveDraftButton").addEventListener("click", () => {
      const records = readHistory();
      records.unshift(buildCurrentRecord());
      writeHistory(records);
      renderHistory();
      renderFullHistory();
      showToast("기록 저장 완료");
    });

    els.matches.innerHTML = `<div class="meta">매장명, 고객코드, 주소를 입력하고 고객 마스터에서 검색하세요.</div>`;
    renderPhotoPreview("loadedPreview", [], "적재함");
    renderPhotoPreview("unloadedPreview", [], "안 실림");
    updateMessage();
    renderHistory();
    renderSetSummary();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./mobile-report-sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
