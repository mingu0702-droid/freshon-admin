<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Stage 직원 인증 계측</title><style>body{font:16px system-ui;max-width:900px;margin:32px auto;padding:16px}label{display:block;margin:16px 0}input,button{font:inherit;padding:10px}input{display:block;max-width:95%;width:360px}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{margin:8px}#results{font:13px monospace}</style></head><body>
<h1>Stage 직원 인증 계측</h1><p>실제 Stage에서 로그인·세션·상세·로그아웃을 5회 측정합니다. 비밀값과 상세 본문은 표시·저장하지 않습니다. 데이터 수집/저장/새로고침 작업은 실행하지 않습니다.</p>
<form id="probeForm" autocomplete="off"><label>직원 공용 아이디<input name="id" required maxlength="128" autocomplete="off"></label><label>직원 공용 비밀번호<input name="password" type="password" required maxlength="1024" autocomplete="off"></label><label>Stage 전용 ADMIN_TOKEN (Production 값 입력 금지)<input name="adminToken" type="password" required autocomplete="off"></label><button type="submit">실제 Stage 5회 계측 시작</button></form>
<p id="state" role="status">대기 · 실행 후 입력값은 즉시 비웁니다.</p><button id="cancel" type="button">측정 중지</button><pre id="results" aria-label="민감정보 없는 계측 결과"></pre>
<script src="/staff-auth-perf.js"></script></body></html>
